<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181126" />
      <stop offset="100%" stop-color="#090510" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F472B6" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg-grad)" stroke="#3B1C56" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-purple)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neon-stroke)" stroke-width="4" filter="url(#neon-glow)" opacity="0.9"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#6B21A8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Cardinal Points Dots -->
  <circle cx="256" cy="96" r="5" fill="#E879F9" filter="url(#neon-glow)"/>
  <circle cx="416" cy="256" r="5" fill="#E879F9" filter="url(#neon-glow)"/>
  <circle cx="256" cy="416" r="5" fill="#E879F9" filter="url(#neon-glow)"/>
  <circle cx="96" cy="256" r="5" fill="#E879F9" filter="url(#neon-glow)"/>

  <!-- Grid Pathways (Digital Highway) -->
  <path d="M 120 220 Q 200 130, 256 160 T 392 292" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
  <path d="M 130 260 Q 210 170, 266 200 T 402 332" fill="none" stroke="#E879F9" stroke-width="2.5" opacity="0.75" filter="url(#neon-glow)"/>
  <path d="M 140 300 Q 220 210, 276 240 T 412 372" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Compass Star Background Points -->
  <polygon points="256,120 270,240 380,256 270,272 256,392 242,272 132,256 242,240" fill="#2E1065" stroke="#9333EA" stroke-width="1.5" opacity="0.7"/>

  <!-- Primary Dynamic Needle -->
  <polygon points="256,110 278,245 400,160 265,278 256,402 234,267 112,352 247,234" fill="url(#needle-grad)" stroke="#FDF4FF" stroke-width="2" filter="url(#neon-glow)"/>

  <!-- Center Core Ring -->
  <circle cx="256" cy="256" r="28" fill="#1E0B36" stroke="#F472B6" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="256" cy="256" r="14" fill="#E879F9"/>
  <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>
</svg>
